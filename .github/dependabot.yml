version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # TypeScript 7 is not yet supported by typescript-eslint (used by eslint-config-next).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Keep @types/node aligned with the Node major used on Vercel (22.x).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
